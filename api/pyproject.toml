[project]
name = "nursing-api"
version = "0.2.0"
description = "FastAPI backend for Nursing Documentation AI."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "nursing-core",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
nursing-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
