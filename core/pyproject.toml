[project]
name = "nursing-core"
version = "0.1.0"
description = "Shared logic for the API, MCP server and evals."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "pydantic>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
