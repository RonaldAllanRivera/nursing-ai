name: Infra

# The Terraform gate, only when the Terraform or the tools it runs change. The check job never
# talks to AWS: every test mocks the provider and the job has no cloud credentials. On a pull
# request from this repository, the plan job then plans infra/live as the read-only GitHub OIDC plan
# role. Applies happen only in deploy.yml, behind the production environment's reviewer.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "scripts/install-tools.sh"
      - "scripts/tflint.pin"
      - "scripts/trivy.pin"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "scripts/install-tools.sh"
      - "scripts/tflint.pin"
      - "scripts/trivy.pin"

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The wrapper would capture terraform's output; the check script reads it itself.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - run: make tools
      # tflint downloads its AWS ruleset from GitHub; the token avoids the anonymous rate limit.
      - run: make infra-check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Off until the repository variable AWS_PLAN_ENABLED is true (after the bootstrap made the role
  # and the first deploy wrote the image_uri output). A fork's pull request gets no OIDC token and
  # Dependabot gets no secrets, so neither runs it. Never `pull_request_target`: the plan runs the
  # pull request's own code. Actions logs here are public: the account id is masked, the sensitive
  # variables print as (sensitive value), and nothing below prints a variable.
  plan:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && vars.AWS_PLAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true
      # -refresh=false: a refresh decrypts every SSM parameter, which the plan role is denied. The
      # image stays the one live now (the image_uri output), so the plan shows only the change.
      - name: Plan infra/live
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          DOMAIN_VALIDATED: ${{ vars.DOMAIN_VALIDATED }}
        run: |
          if [ -n "$DOMAIN_NAME" ]; then export TF_VAR_domain_name="$DOMAIN_NAME"; fi
          if [ "$DOMAIN_VALIDATED" = "true" ]; then export TF_VAR_domain_validated=true; fi
          terraform -chdir=infra/live init -input=false -backend-config="bucket=$STATE_BUCKET"
          TF_VAR_image_uri="$(terraform -chdir=infra/live output -raw image_uri)"
          export TF_VAR_image_uri
          terraform -chdir=infra/live plan -refresh=false -input=false -no-color -lock-timeout=120s
