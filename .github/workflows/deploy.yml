name: Deploy

# Deploys the demo once CI has passed on a push to main: the same scripts/deploy.sh that
# `make deploy` runs, as the GitHub OIDC deploy role, after the production environment's reviewer
# approves. Off until the repository variable DEPLOY_ENABLED is true: set it only once the bootstrap
# has made the deploy role and the production environment has a required reviewer and allows
# main only (the role trusts any job in that environment). Actions logs of this public repository
# are public: the account id is masked, nothing here prints a variable, and the script prints only
# its step names and the image tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and never cancel one half-way through an apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # A re-run of an old commit's CI also ends as a success on a push to main. Deploy only the
      # commit that is main's tip now, read from the public repository with no credentials. When it
      # is not, every later step is skipped and the run still ends green.
      - id: tip
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          if [ "$tip" = "$HEAD_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Not the tip of main any more, so nothing is deployed.\n'
          fi
      # The commit CI checked, even if main has moved on while the reviewer was away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.current == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.current == 'true'
        working-directory: web
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.tip.outputs.current == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true
      - name: Deploy the demo
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_APPROVED: "yes"
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          DOMAIN_VALIDATED: ${{ vars.DOMAIN_VALIDATED }}
        run: |
          if [ -n "$DOMAIN_NAME" ]; then export TF_VAR_domain_name="$DOMAIN_NAME"; fi
          if [ "$DOMAIN_VALIDATED" = "true" ]; then export TF_VAR_domain_validated=true; fi
          scripts/deploy.sh demo
