name: ${COMPOSE_PROJECT_NAME:-nursing-ai-0}

# The API's image and database, shared by the one-shot jobs that run before it starts.
x-database-env: &database-env
  DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-localdev}@db:5432/app

x-api-image: &api-image
  build:
    context: .
    dockerfile: api/Dockerfile
  environment: *database-env

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  # Compose runs only on a developer's PC and in CI's end-to-end job, and both need the demo
  # people and patients, so every `up` migrates and then seeds; a re-seed never undoes an edit.
  # The live stack migrates from its deploy job and is never seeded.
  migrate:
    <<: *api-image
    command: ["python", "-m", "nursing_core.storage.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *api-image
    command: ["python", "-m", "nursing_core.storage.seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # AI_MODE is mock (canned drafts) or replay (recorded drafts). The key and the monthly cap are
  # never passed: live mode stays unsupported in Compose, and the app refuses it without them.
  # The Google client and the first admin's email come from .env; a name it leaves out arrives
  # empty, which the app reads as unset (Google sign-in off). Google's redirect goes to the web
  # app's own origin, which Vite proxies to this container.
  api:
    <<: *api-image
    environment:
      <<: *database-env
      APP_ENV: ${APP_ENV:-dev}
      AI_MODE: ${AI_MODE:-mock}
      SITE_URL: http://localhost:${WEB_PORT:-5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=4)"
      interval: 5s
      timeout: 6s
      retries: 10

volumes:
  db-data:
