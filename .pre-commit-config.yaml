# Every hook is local and runs the tools this repo already pins (uv.lock, pnpm-lock.yaml,
# .tools/bin), so pre-commit itself never downloads anything.
# `make hooks` installs both git hooks. The commit hooks run on commit only; the whole-history
# public check (private words in every message and identity) runs before every push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      # ESLint and Prettier run on the whole web project: pre-commit passes paths that start
      # with web/, but they run inside web/, and a type-aware ESLint wants the whole project.
      - id: eslint
        name: eslint
        entry: pnpm -C web lint
        language: system
        files: ^web/
        pass_filenames: false
      - id: prettier
        name: prettier check
        entry: pnpm -C web format:check
        language: system
        files: ^web/
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        entry: .tools/bin/gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
      # Formatting only: `make infra-check` runs the full Terraform gate (validate, test, lint, scan).
      - id: terraform-fmt
        name: terraform fmt check
        entry: terraform fmt -check -recursive infra
        language: system
        files: ^infra/.*\.(tf|tfvars|tftest\.hcl)$
        pass_filenames: false
      - id: staged-check
        name: staged check (private words, markers, paths)
        entry: uv run python scripts/staged_check.py
        language: system
        verbose: true
        always_run: true
        pass_filenames: false
      - id: public-check
        name: public check (whole history, before a push)
        entry: uv run python scripts/public_check.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
